<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lebanese Grill Kilburn | Charcoal grills, shawarma &amp; sharing meals</title>
<meta name="description" content="Halal Lebanese and Middle Eastern grill at 40–42 Willesden Lane, Kilburn. Open 11am–1am every day. Takeaway and delivery.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ember:#F26A1B; --pom:#7C1526; --pom-deep:#5A0E1B; --cedar:#1F4D3A;
  --bg:#FBF8F6; --surface:#FFFFFF; --ink:#2A1A17; --muted:#6B5A55; --line:#E8DDD8; --on-pom:#FFF3EC;
  --display:"Bricolage Grotesque","Arial Black",Impact,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1211;--surface:#251A18;--ink:#F6ECE8;--muted:#BDA9A2;--line:#3A2B28;--cedar:#7FC4A3}}
:root[data-theme="dark"]{--bg:#1A1211;--surface:#251A18;--ink:#F6ECE8;--muted:#BDA9A2;--line:#3A2B28;--cedar:#7FC4A3}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body)}
a{color:inherit}
:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* hero */
.hero{background:radial-gradient(120% 90% at 80% 110%,rgba(242,106,27,.55),transparent 55%),var(--pom-deep);color:var(--on-pom);padding:20px 0 72px;overflow:hidden;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:64px}
.brand{font:800 1.05rem/1.1 var(--display);letter-spacing:.01em;text-decoration:none}
.status{font-size:.9rem;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);padding:6px 12px;border-radius:99px}
.dot{width:9px;height:9px;border-radius:50%;background:#7CE0A6}
.status.closed .dot{background:#F2B33D}
h1{font:800 clamp(3rem,12vw,7.5rem)/.92 var(--display);letter-spacing:-.03em;margin:0 0 24px;max-width:11ch}
h1 span{display:block;color:var(--ember)}
.lede{font-size:1.2rem;max-width:34ch;margin:0 0 32px;color:#F7DCCF}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:15px 26px;border-radius:99px;font-weight:600;text-decoration:none;border:2px solid transparent;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ember);color:#2A0C00}
.btn.ghost{border-color:rgba(255,243,236,.55);color:var(--on-pom)}
.embers{position:absolute;inset:0;pointer-events:none}
.embers i{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;background:var(--ember);opacity:0;animation:rise 7s linear infinite}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-520px) translateX(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.embers{display:none}html{scroll-behavior:auto}}


.gallery{padding-top:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.grid figure{margin:0;border-radius:16px;overflow:hidden;position:relative;background:var(--line)}
.grid img{display:block;width:100%;height:100%;object-fit:cover;aspect-ratio:1/1}
.grid figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 14px 10px;color:#fff;font-weight:600;font-size:.95rem;background:linear-gradient(transparent,rgba(30,8,4,.8))}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}.grid .wide{grid-column:span 2}.grid .wide img{aspect-ratio:2/1}}
.flyers{display:grid;gap:16px;margin-top:40px}
.flyers img{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--line)}
.flyers a{display:block}
.shop{width:100%;height:auto;display:block;border-radius:18px;margin-top:32px}
.hero-photo{display:none}
@media(min-width:900px){.hero-photo{display:block;position:absolute;right:20px;bottom:72px;width:300px;border-radius:20px;transform:rotate(3deg);box-shadow:0 20px 50px rgba(0,0,0,.45);border:4px solid var(--on-pom)}}

/* strip */
.strip{background:var(--cedar);color:#F1FBF5;padding:14px 0;font-weight:600}
.strip ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:center;text-align:center}
:root[data-theme="dark"] .strip,:root:not([data-theme="light"]) .strip{color:#F1FBF5}

section{padding:72px 0}
h2{font:800 clamp(2rem,6vw,3.2rem)/1.05 var(--display);letter-spacing:-.02em;margin:0 0 12px}
.intro{color:var(--muted);max-width:56ch;margin:0 0 40px}
.about{display:grid;gap:32px}
@media(min-width:800px){.about{grid-template-columns:1.1fr 1fr;align-items:start}}
.why{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.why li{padding:12px 0;border-bottom:1px solid var(--line)}

/* menu */
.menu{background:var(--surface);border-block:1px solid var(--line)}
.groups{display:grid;gap:20px}
@media(min-width:720px){.groups{grid-template-columns:repeat(2,1fr)}}
.group{border-left:6px solid var(--ember);padding:4px 0 4px 20px}
.group:nth-child(3n+2){border-color:var(--pom)}
.group:nth-child(3n){border-color:var(--cedar)}
.group h3{font:800 1.6rem/1.1 var(--display);margin:0 0 6px}
.group p{margin:0 0 12px;color:var(--muted);font-size:.98rem}
.group ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.group li{background:var(--bg);border:1px solid var(--line);padding:5px 12px;border-radius:99px;font-size:.95rem}

/* sharing */
.share{background:var(--pom);color:var(--on-pom)}
.share .intro{color:#F4D2C6;margin:0 0 28px}
.share p.big{font:600 clamp(1.3rem,3.5vw,1.9rem)/1.3 var(--display);max-width:30ch;margin:0 0 28px}

/* visit */
.visit{display:grid;gap:32px}
@media(min-width:800px){.visit{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px}
.card h3{margin:0 0 10px;font:800 1.3rem var(--display)}
.card address{font-style:normal}
.hours{font:800 2rem/1.1 var(--display);margin:0 0 4px}
.phone{font:800 clamp(1.6rem,6vw,2.2rem)/1.1 var(--display);text-decoration:none;color:var(--pom)}
:root[data-theme="dark"] .phone,:root:not([data-theme="light"]) .phone{color:var(--ember)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .phone{color:var(--pom)}}
footer{padding:32px 0 48px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
.sticky{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;text-align:center}
.sticky .btn{width:100%;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@media(min-width:800px){.sticky{display:none}}
body{padding-bottom:80px}
@media(min-width:800px){body{padding-bottom:0}}
</style>
</head>
